# .github/workflows/data-refresh.yml
name: Refresh MF Corpus Data

on:
  schedule:
    # Run daily at 4:30 AM UTC (10:00 AM IST) for fresh NAV data
    - cron: '30 4 * * *'
    # Also run every 6 hours to catch intraday updates
    - cron: '30 10 * * *'
    - cron: '30 16 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:  # Allow manual trigger as well
    inputs:
      force_refresh:
        description: 'Force refresh even if no changes detected'
        required: false
        default: 'false'

jobs:
  refresh-corpus:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper diff
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          # Upgrade pip first to avoid installation issues
          python -m pip install --upgrade pip setuptools wheel
          
          # Install PyTorch first (required by sentence-transformers)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          
          # Install remaining dependencies
          pip install -r requirements.txt
          
          # Install Playwright browsers
          playwright install chromium
          
      - name: Verify installations
        run: |
          python -c "import sentence_transformers; print('sentence-transformers OK')"
          python -c "import chromadb; print('chromadb OK')"
          python -c "import groq; print('groq OK')"
          
      - name: Run data ingestion
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/run_phase_1_complete.py
          
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      - name: Check for changes
        id: git-check
        run: |
          git add data/
          git diff --staged --quiet && echo "has_changes=false" >> $GITHUB_OUTPUT || echo "has_changes=true" >> $GITHUB_OUTPUT
          
      - name: Create Pull Request with updated data
        if: steps.git-check.outputs.has_changes == 'true' || github.event.inputs.force_refresh == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🔄 Auto-refresh: Updated corpus data $(date '+%Y-%m-%d %H:%M')"
          title: "🔄 Auto-refresh: Corpus data updated"
          body: |
            Automated corpus refresh detected changes:
            - **Scraped date:** $(date '+%Y-%m-%d %H:%M')
            - **Source:** groww.in (5 scheme pages)
            - **Documents:** 5 HDFC Mutual Fund schemes
            - **Chunks:** Created and embedded
            
            Please review and merge to update the FAQ database.
          branch: auto-refresh/corpus-$(date '+%Y%m%d-%H%M')
          base: main
          add-paths: data/
          delete-branch: true
          
      - name: Create summary
        if: always()
        run: |
          echo "## Data Refresh Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes detected:** ${{ steps.git-check.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force refresh:** ${{ github.event.inputs.force_refresh || 'false' }}" >> $GITHUB_STEP_SUMMARY

