# .github/workflows/data-refresh.yml
name: Refresh MF Corpus Data

on:
  schedule:
    # Run daily at 4:30 AM UTC (10:00 AM IST) for fresh NAV data
    - cron: '30 4 * * *'
    # Also run every 6 hours to catch intraday updates
    - cron: '30 10 * * *'
    - cron: '30 16 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:  # Allow manual trigger as well
    inputs:
      force_refresh:
        description: 'Force refresh even if no changes detected'
        required: false
        default: 'false'

jobs:
  refresh-corpus:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper diff
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Verify installations
        run: |
          python -c "import openai; print('openai OK')"
          python -c "import chromadb; print('chromadb OK')"
          python -c "import groq; print('groq OK')"
          
      - name: Run data ingestion
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/run_phase_1_complete.py
          
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      - name: Check for changes
        id: git-check
        run: |
          git add data/
          git diff --staged --quiet && echo "has_changes=false" >> $GITHUB_OUTPUT || echo "has_changes=true" >> $GITHUB_OUTPUT
          
      - name: Generate PR metadata
        id: pr-metadata
        run: |
          BRANCH_NAME="auto-refresh/corpus-$(date '+%Y%m%d-%H%M')"
          TIMESTAMP="$(date '+%Y-%m-%d %H:%M')"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Create Pull Request with updated data
        if: steps.git-check.outputs.has_changes == 'true' || github.event.inputs.force_refresh == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🔄 Auto-refresh: Updated corpus data ${{ steps.pr-metadata.outputs.timestamp }}"
          title: "🔄 Auto-refresh: Corpus data updated ${{ steps.pr-metadata.outputs.timestamp }}"
          body: |
            ## Automated Corpus Refresh
            
            The scheduled data refresh has completed successfully.
            
            ### Changes:
            - **Scraped date:** ${{ steps.pr-metadata.outputs.timestamp }}
            - **Source:** groww.in (5 scheme pages)
            - **Documents:** 5 HDFC Mutual Fund schemes
            - **Chunks:** Created and embedded
            
            ### Action Required:
            Please review and merge this PR to update the FAQ database with the latest mutual fund data.
            
            ---
            *This PR was created automatically by the data refresh workflow.*
          branch: ${{ steps.pr-metadata.outputs.name }}
          base: main
          add-paths: data/
          delete-branch: true
          labels: automated-refresh
          assignees: ${{ github.repository_owner }}
          
      - name: Create summary
        if: always()
        run: |
          echo "## Data Refresh Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes detected:** ${{ steps.git-check.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force refresh:** ${{ github.event.inputs.force_refresh || 'false' }}" >> $GITHUB_STEP_SUMMARY

