# Render Deployment Configuration — MF FAQ Assistant (Backend)
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: mf-faq-assistant-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ping
    
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: LLM_MAX_TOKENS
        value: "256"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: HF_TOKEN
        sync: false
