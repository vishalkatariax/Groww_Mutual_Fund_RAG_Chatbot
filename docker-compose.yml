version: '3.8'

###############################################################################
# MF FAQ Assistant - Docker Compose Configuration
#
# Services:
#   - backend: FastAPI API server
#   - frontend: React + Vite production build (nginx)
#   - chromadb: Vector database (persistent storage)
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose up backend     # Start only backend
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop all services
###############################################################################

services:
  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - EMBEDDING_DIMENSIONS=384
      - VECTOR_STORE_PATH=/data/chroma_db
      - VECTOR_STORE_COLLECTION=mf_faq_corpus
      - RAG_TOP_K=3
      - API_PORT=8000
    volumes:
      - chroma_data:/data/chroma_db
      - ./data:/app/data
    depends_on:
      - chromadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mf-network

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - ALLOW_RESET=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mf-network

  # Frontend (Production - nginx)
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mf-network

  # Frontend (Development - Vite with hot reload)
  # Uncomment for development mode
  # frontend-dev:
  #   build:
  #     context: ./app/frontend
  #     dockerfile: Dockerfile
  #     target: development
  #   ports:
  #     - "3000:5173"
  #   volumes:
  #     - ./app/frontend:/app
  #     - /app/node_modules
  #   environment:
  #     - VITE_API_URL=http://backend:8000
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  #   networks:
  #     - mf-network

volumes:
  chroma_data:
    driver: local

networks:
  mf-network:
    driver: bridge
